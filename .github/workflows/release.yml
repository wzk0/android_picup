name: Release

# Tag pushes only (v*): build, sign, verify and publish the APK.
#
# Release builds are signed: this workflow decodes the four PICUP_* secrets
# into $RUNNER_TEMP before Gradle runs, and app/build.gradle.kts only creates
# the externalRelease signingConfig when PICUP_KEYSTORE_PATH is set. Nothing
# signing-related is ever committed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  ANDROID_PLATFORM: 'platforms;android-37.0'
  ANDROID_BUILD_TOOLS: 'build-tools;37.0.0'
  APK_DIR: app/build/outputs/apk/release

jobs:
  release:
    name: Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install Android SDK
        run: |
          (set +o pipefail; yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "${{ env.ANDROID_PLATFORM }}" \
            "${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # A v* tag must produce a signed APK, so all four secrets are mandatory
      # here: a missing one fails the job instead of silently publishing an
      # unsigned build. This workflow runs on tag pushes only, which is why
      # there is no "unsigned fallback" path any more.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PICUP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PICUP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PICUP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PICUP_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::A release tag needs all four PICUP_* signing secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          {
            echo "PICUP_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "PICUP_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "PICUP_KEY_ALIAS=$KEY_ALIAS"
            echo "PICUP_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Release and Lint
        run: |
          ./gradlew :app:assembleRelease :app:lintRelease \
            --stacktrace --max-workers=2

      # Fails the tag build if the APK came out unsigned or with another key.
      - name: Verify APK signature
        run: |
          set -euo pipefail
          build_tools="${ANDROID_BUILD_TOOLS#build-tools;}"
          "$ANDROID_HOME/build-tools/$build_tools/apksigner" \
            verify --verbose --print-certs "$APK_DIR"/*.apk

      # Name the asset after the version in version.properties (PicUp-0.0.1.apk)
      # so release downloads carry a meaningful filename.
      - name: Name the APK and generate checksums
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/^name=//p' version.properties)
          asset="PicUp-${version_name// /-}.apk"
          mkdir -p dist
          mv "$APK_DIR"/*.apk "dist/$asset"
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 只收集 Release 目录，绝不收集 Debug APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PicUp-release
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # `gh release create` can generate notes, `gh release edit` cannot
          # (it has no --generate-notes flag), so an update only rewrites the
          # body when a notes file exists and otherwise keeps the existing one.
          if [ -f "docs/release-notes/$TAG.md" ]; then
            create_notes=(--notes-file "docs/release-notes/$TAG.md")
            edit_notes=("${create_notes[@]}")
          else
            create_notes=(--generate-notes)
            edit_notes=()
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "PicUp $TAG" "${edit_notes[@]}"
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
              --title "PicUp $TAG" --verify-tag "${create_notes[@]}"
          fi