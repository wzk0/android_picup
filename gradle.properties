# Project-wide Gradle settings.
# The reference project on this machine must lower these heaps on 16 GB laptops:
#   ./gradlew <task> -Dorg.gradle.jvmargs="-Xmx2560m" -Dkotlin.daemon.jvmargs="-Xmx1536m" --no-parallel
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m

org.gradle.parallel=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# Required by AGP 9 for the optimization {} DSL (R8 in release builds).
android.r8.gradual.support=true
org.gradle.tooling.parallel=true